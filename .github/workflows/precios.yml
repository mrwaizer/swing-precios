name: precios
on:
  schedule:
    - cron: "15 5,9,15 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python fetch_prices.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add precios.json precios.txt
          git commit -m "precios $(date -u +%F_%H:%M)" || echo "sin cambios"
          git push
