name: precios
on:
  schedule:
    - cron: "7 4 * * 1-5"
    - cron: "37 4 * * 1-5"
    - cron: "7 5 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: precios-loop
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 790
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: Bucle de precios cada ~10 min hasta las 17:40 Andorra
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          while true; do
            H=$(TZ=Europe/Andorra date +%H%M)
            if [ "$H" -gt 1745 ]; then break; fi
            python fetch_prices.py || true
            git add precios.json precios.txt historial.csv
            git commit -m "precios $(date -u +%F_%H:%M)" || echo "sin cambios"
            git pull --rebase || true
            git push || true
            sleep 540
          done
